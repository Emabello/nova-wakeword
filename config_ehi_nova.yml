# Configurazione per openwakeword/train.py (v0.6.0). Le clip le genera generate_clips.py (voci italiane).
model_name: "ehi_nova"
target_phrase: ["ehi nova"]
custom_negative_phrases: []
n_samples: 6000
n_samples_val: 1000
tts_batch_size: 50
augmentation_batch_size: 16
piper_sample_generator_path: "./unused"
output_dir: "./out"
rir_paths: ["./data/mit_rirs"]
background_paths: ["./data/background"]
background_paths_duplication_rate: [1]
false_positive_validation_data_path: "./data/validation_set_features.npy"
augmentation_rounds: 2
feature_data_files:
  "ACAV100M_sample": "./data/negative_features.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50
model_type: "dnn"
layer_size: 32
steps: 30000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
