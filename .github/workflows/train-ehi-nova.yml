# Addestra il modello base "ehi nova" (openWakeWord) e lo pubblica come artifact.
# Nessun segreto: solo voci sintetiche e dataset pubblici. Il .onnx si importa in Nova > Allenamento.
name: Addestra "ehi nova"

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Passi di addestramento"
        default: "30000"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Controllo sicurezza
        run: python3 scripts/check_repo.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Libera spazio su disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Dipendenze
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1 torchaudio==2.4.1
          pip install openwakeword==0.6.0 --no-deps
          pip install onnxruntime==1.19.2 piper-tts==1.3.0 numpy==1.26.4 scipy pyyaml tqdm torchinfo torchmetrics \
            audiomentations==0.33.0 torch-audiomentations==0.11.1 acoustics mutagen pronouncing "datasets<3" soundfile speechbrain==0.5.16 onnx==1.16.2
          # Le reti di feature (le stesse incluse in Nova) non sono nel pacchetto pip
          R=$(python -c "import openwakeword,os;print(os.path.join(os.path.dirname(openwakeword.__file__),'resources','models'))")
          mkdir -p "$R"
          for f in melspectrogram.onnx embedding_model.onnx; do
            curl -sSfL -o "$R/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
      - name: Dati
        run: ./fetch_data.sh
      - name: Clip sintetiche (voci italiane + inglesi)
        run: python generate_clips.py --voices voices --out out/ehi_nova --n 6000 --n-val 1000
      - name: Augmentation e feature
        run: python -m openwakeword.train --training_config config_ehi_nova.yml --augment_clips
      - name: Addestramento
        run: |
          sed -i "s/^steps: .*/steps: ${{ github.event.inputs.steps }}/" config_ehi_nova.yml
          # La conversione finale in TFLite richiede TensorFlow e a Nova non serve (usa ONNX):
          # il passo è riuscito se il modello ONNX c'è
          python -m openwakeword.train --training_config config_ehi_nova.yml --train_model || true
          test -s out/ehi_nova.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: ehi_nova
          path: |
            out/ehi_nova.onnx
            out/ehi_nova*.json
          if-no-files-found: error
